<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Add Scholarship | Scholarship Finder
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

    <style>

        .admin-page {
            min-height: 100vh;
            background: #f8f9ff;
            padding: 60px 7%;
        }


        .admin-container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 22px;
            border: 1px solid #eee;
        }


        .admin-header {
            margin-bottom: 30px;
        }


        .admin-header span {
            color: #6956e8;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
        }


        .admin-header h1 {
            margin: 8px 0;
            font-size: 32px;
        }


        .admin-header p {
            color: #888;
            font-size: 13px;
        }


        .admin-form {
            display: grid;
            gap: 18px;
        }


        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }


        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }


        .form-group label {
            font-size: 11px;
            font-weight: 700;
        }


        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 12px;
        }


        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }


        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #6956e8;
        }


        .submit-button {
            margin-top: 10px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6956e8;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }


        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #6956e8;
            font-size: 12px;
        }


        @media (max-width: 600px) {

            .admin-page {
                padding: 30px 5%;
            }


            .admin-container {
                padding: 25px;
            }


            .form-row {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<main class="admin-page">

    <div class="admin-container">

        <a
            href="/dashboard"
            class="back-link"
        >
            ← Back to Dashboard
        </a>


        <div class="admin-header">

            <span>
                SCHOLARSHIP MANAGEMENT
            </span>

            <h1>
                Add a Scholarship 🎓
            </h1>

            <p>
                Add complete eligibility information
                so students receive accurate matches.
            </p>

        </div>


        <form
            method="POST"
            class="admin-form"
        >


            <div class="form-group">

                <label>
                    Scholarship Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Example: Telangana ePASS Scholarship"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Provider / Organization
                </label>

                <input
                    type="text"
                    name="provider"
                    placeholder="Example: Government of Telangana"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    name="description"
                    placeholder="Describe the scholarship..."
                ></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Award Amount
                    </label>

                    <input
                        type="text"
                        name="amount"
                        placeholder="₹50,000"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Deadline
                    </label>

                    <input
                        type="text"
                        name="deadline"
                        placeholder="31 December 2026"
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Course
                    </label>

                    <input
                        type="text"
                        name="course"
                        placeholder="B.Tech"
                    >

                </div>


                <div class="form-group">

                    <label>
                        State
                    </label>

                    <input
                        type="text"
                        name="state"
                        placeholder="Telangana"
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select name="category">

                        <option value="">
                            Select category
                        </option>

                        <option value="General">
                            General
                        </option>

                        <option value="BC">
                            BC
                        </option>

                        <option value="SC">
                            SC
                        </option>

                        <option value="ST">
                            ST
                        </option>

                        <option value="EWS">
                            EWS
                        </option>

                        <option value="Merit">
                            Merit
                        </option>

                        <option value="Need Based">
                            Need Based
                        </option>

                        <option value="Government">
                            Government
                        </option>

                        <option value="Women">
                            Women
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Gender Eligibility
                    </label>

                    <select name="gender">

                        <option value="All">
                            All
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Male">
                            Male
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label>
                    Maximum Family Income
                </label>

                <input
                    type="text"
                    name="income_limit"
                    placeholder="300000"
                >

            </div>


            <div class="form-group">

                <label>
                    Application Link
                </label>

                <input
                    type="url"
                    name="application_link"
                    placeholder="https://example.com/apply"
                >

            </div>


            <button
                type="submit"
                class="submit-button"
            >

                Add Scholarship 🎓

            </button>


        </form>

    </div>

</main>

</body>

</html>
